[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "freeddpm"
version = "1.0.0"
description = "Reference implementation for 'Free denoising diffusion models'"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Swagatam Das", email = "swagatam.das@isical.ac.in" }]
keywords = ["free probability", "diffusion models", "random matrices", "score matching"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["freeddpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
